[tool.poetry]
name = "gemini-geothermal-suite-open"
version = "1.0.3"
description = "Open Source suite of the GEMINI Geothermal Digital Twin"
authors = [ "Ryvo Octaviano <ryvo.octaviano@tno.nl>",
    "Leila Hashemi <leila.hashemi@tno.nl>",
    "Demetris Palochis <demetris.palochis@tno.nl>",
    "Arturs Blinovs <arturs.blinovs@we-p.nl>"
]
readme = "README.md"
packages = [{ include = "gemini" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development"
]
homepage = "https://nwn.nu/projecten/innovaties/datagedreven-optimalisatie-aardwarmte-systemen/"
documentation = "https://github.com/GEMINI-Digital-Twin/gemini-geothermal-suite-open"
repository = "https://github.com/GEMINI-Digital-Twin/gemini-geothermal-suite-open"

[tool.poetry.dependencies]
python = "^3.11, <3.13"
pandas = "2.3.3"
scipy = "1.13.1"
numpy = "2.2.6"
pytz = "2024.2"
pydantic = "^2"
pyarrow = { version = ">=15", optional = true }

[tool.poetry.extras]
parquet = ["pyarrow"]

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-cov = "5.0.0"
flake8 = "7.3.0"
flake8-docstrings = "1.7.0"
black = "25.11.0"
isort = "7.0.0"
Flake8-pyproject = "1.2.3"
myst-parser = "3.0.1"
sphinx = "7.4.7"
sphinx-rtd-theme = "2.0.0"
sphinx-autodoc-typehints = "2.3.0"


[tool.flake8]
max-line-length = 100
extend-ignore = ["W503", "W504", "E127", "E128", "E203", "E402", "E722", "D202"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "--strict-markers -m 'not e2e and not slow'"
markers = [
    "unit: isolated tests mirroring one source unit",
    "integration: tests combining multiple runtime components",
    "e2e: full public workflows on committed example data",
    "slow: tests intentionally exceeding the one-second fast-tier budget",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
