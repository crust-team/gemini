[project]
name = "gemini-geothermal-suite-open"
version = "1.0.3"
description = "Open Source suite of the GEMINI Geothermal Digital Twin"
authors = [
    { name = "Ryvo Octaviano", email = "ryvo.octaviano@tno.nl" },
    { name = "Leila Hashemi", email = "leila.hashemi@tno.nl" },
    { name = "Demetris Palochis", email = "demetris.palochis@tno.nl" },
    { name = "Arturs Blinovs", email = "arturs.blinovs@we-p.nl" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
dependencies = [
    "pandas>=2.2.2",
    "pandas>=2.2.3; python_version >= '3.13'",
    "pandas>=2.3.3; python_version >= '3.14'",
    "scipy>=1.13.0",
    "scipy>=1.14.1; python_version >= '3.13'",
    "scipy>=1.16.1; python_version >= '3.14'",
    "numpy>=2.0.0",
    "numpy>=2.1.0; python_version >= '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "pytz>=2020.1",
    "pytz>=2023.4; python_version >= '3.12'",
    "pydantic>=2.5.0",
    "pydantic>=2.8.0; python_version >= '3.13'",
    "pydantic>=2.12.0; python_version >= '3.14'",
]

[project.urls]
homepage = "https://nwn.nu/projecten/innovaties/datagedreven-optimalisatie-aardwarmte-systemen/"
documentation = "https://github.com/GEMINI-Digital-Twin/gemini-geothermal-suite-open"
repository = "https://github.com/GEMINI-Digital-Twin/gemini-geothermal-suite-open"

[dependency-groups]
test = ["pytest==9.2.0", "pytest-xdist>=3.8,<4"]
lint = [
    "flake8==7.5.0",
    "flake8-docstrings==1.7.0",
    "Flake8-pyproject==1.2.4",
    "black==26.10.1",
    "isort==9.0.2",
]
docs = [
    "sphinx==9.0.4; python_version < '3.12'",
    "sphinx==9.1.1; python_version == '3.12'",
    "sphinx==9.2.0; python_version >= '3.13'",
    "sphinx-rtd-theme==3.1.0",
]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "docs" }]

[tool.poetry]
packages = [{ include = "gemini" }]


[tool.flake8]
max-line-length = 100
extend-ignore = ["W503", "W504", "E127", "E128", "E203", "D202"]
max-complexity = 10

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-p tests.xdist_plugin -n auto --dist loadgroup --strict-markers -m 'not e2e and not slow'"
markers = [
    "unit: isolated tests mirroring one source unit",
    "integration: tests combining multiple runtime components",
    "e2e: full public workflows on committed example data",
    "slow: tests intentionally exceeding the one-second fast-tier budget",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
