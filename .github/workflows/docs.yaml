# This workflow builds the Sphinx documentation and publishes it to GitHub Pages
# For more information see: https://docs.github.com/en/pages

name: Docs

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v7
    - name: Install Python 3.14, the package and the docs tools
      run: |
        uv venv --python 3.14
        uv pip install -e . --group docs
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Build documentation
      run: |
        sphinx-build -W -b html docs docs/_build/html
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        destination_dir: main
        keep_files: true
