name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  fast:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        pip install poetry
        poetry install --extras parquet
    - name: Run fast tier
      run: poetry run pytest -n auto

  fast-e2e:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs: fast
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        pip install poetry
        poetry install --extras parquet
    - name: Run slow tier on fast data
      run: poetry run pytest -n auto -m "e2e or slow" --dataset=fast

  full-year:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        pip install poetry
        poetry install --extras parquet
    - name: Run all tests on full-year data
      run: poetry run pytest -n auto -m "" --dataset=slow
