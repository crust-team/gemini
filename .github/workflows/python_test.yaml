name: Test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  development:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'branch' &&
       github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref != 'main')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        pip install poetry
        poetry install --extras parquet
    - name: Run development profile against the base
      env:
        BASE: ${{ github.base_ref || 'main' }}
      run: poetry run python scripts/test_changed.py --base "origin/$BASE"

  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        pip install poetry
        poetry install --extras parquet
    - name: Run release profile on full-year data
      run: poetry run pytest -n auto -m "" --dataset=slow --profile=release --durations=20
